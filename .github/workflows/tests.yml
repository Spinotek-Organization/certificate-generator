name: Package tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '^12.0'
            php: '8.2'
          - laravel: '^13.0'
            php: '8.3'
          - laravel: '^13.0'
            php: '8.4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Validate package
        run: composer validate --strict
      - name: Install the matching Laravel sandbox
        working-directory: sandbox
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: |
          composer config --unset platform.php
          composer require --no-update --no-interaction "laravel/framework:$LARAVEL_VERSION"
          composer update --prefer-dist --no-interaction
      - name: Run package tests
        run: composer --working-dir=sandbox test
